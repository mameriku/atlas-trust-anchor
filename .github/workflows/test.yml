name: Anchor tests

# The status check GOVERNANCE.md requires on the default branch (its job id is
# `test`, and that name is what the ruleset's required check refers to). It runs
# the adversarial suite and the workflow lint over this repository as committed.
#
# It is SECRETLESS on purpose. It runs on pushes and pull requests - including
# from forks - so it must never be able to read the target credential, and the
# lint refuses any secret reference outside the qualification workflow.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Install the test runner
        run: python3 -m pip install --user --disable-pip-version-check pytest==9.1.1 pyyaml==6.0.2

      - name: Lint the workflows
        run: python3 -I -S -B anchor/pinlint.py .github/workflows

      - name: Run the suite
        run: python3 -m pytest tests -q
